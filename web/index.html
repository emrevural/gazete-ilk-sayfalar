<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Gazete İlk Sayfalar</title>
<script>window.STATIK=true;</script>
<style>
  :root{
    --fs:1.3;
    --bg:#f4f1ea; --card:#fff; --ink:#1b1b1b; --muted:#6b6b6b;
    --brand:#14213d; --accent:#c1121f; --line:#e2ddd2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:calc(19px * var(--fs));margin:0;font-family:Georgia,"Times New Roman",serif;letter-spacing:.3px}
  .date{font-size:calc(12px * var(--fs));opacity:.75;margin-top:2px}
  .iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;width:46px;height:46px;border-radius:10px;font-size:calc(20px * var(--fs));cursor:pointer}
  .tabs{display:flex;gap:4px;margin-top:12px}
  .tab{flex:1;background:none;border:0;color:#fff;opacity:.6;padding:10px 0 12px;font-size:calc(15px * var(--fs));font-weight:600;
    border-bottom:3px solid transparent;cursor:pointer}
  .tab.active{opacity:1;border-bottom-color:var(--accent)}
  main{padding:14px}
  .status{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.5}
  .status button{margin-top:12px}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:calc(14px * var(--fs));cursor:pointer}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(150px * var(--fs)),1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:transform .12s}
  .card:active{transform:scale(.97)}
  .thumb{aspect-ratio:3/4.4;background:#e9e5db center/cover no-repeat;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .name{padding:8px 10px;font-size:calc(13px * var(--fs));font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);font-size:calc(15px * var(--fs));margin-bottom:12px;background:#fff}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;
    animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Görüntüleyici */
  #viewer{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
  #viewer.open{display:flex}
  .vbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;color:#fff;background:rgba(0,0,0,.7)}
  .vtitle{flex:1;font-weight:600;font-size:calc(15px * var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab}
  .stage.drag{cursor:grabbing}
  .stage img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;max-height:none}
  .vnot{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:2;background:rgba(0,0,0,.75);color:#fff;font-size:calc(12px * var(--fs));padding:6px 10px;border-radius:8px;display:none;text-align:center;max-width:90%}
  .zoombar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);
    display:flex;align-items:center;gap:6px;background:rgba(20,20,20,.85);padding:6px;border-radius:14px;z-index:2}
  .zbtn{width:48px;height:48px;border:0;border-radius:10px;background:#2b2b2b;color:#fff;font-size:calc(24px * var(--fs));font-weight:700;cursor:pointer}
  .zbtn:active{background:#444}
  .zval{color:#fff;min-width:56px;text-align:center;font-size:calc(14px * var(--fs));font-variant-numeric:tabular-nums}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:64px;border:0;
    background:rgba(0,0,0,.45);color:#fff;font-size:calc(28px * var(--fs));cursor:pointer}
  .nav.prev{left:0;border-radius:0 10px 10px 0}.nav.next{right:0;border-radius:10px 0 0 10px}
  .vloading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa}

  /* Keşanspor */
  .ks-head{background:linear-gradient(135deg,#7a0d14,#c1121f);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px}
  .ks-crest{width:52px;height:52px;border-radius:50%;background:#fff;color:#c1121f;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-family:Georgia,serif;font-size:calc(22px * var(--fs));flex:none}
  .ks-head h2{margin:0;font-size:calc(20px * var(--fs));font-family:Georgia,serif}
  .ks-head .sub{font-size:calc(13px * var(--fs));opacity:.85;margin-top:3px}
  .ks-stats{display:flex;gap:16px;margin-left:auto;text-align:center}
  .ks-stats b{display:block;font-size:calc(22px * var(--fs))}
  .ks-stats span{font-size:calc(11px * var(--fs));opacity:.8}
  .seg{display:flex;background:#e6e1d6;border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:8px;font-size:calc(14px * var(--fs));font-weight:600;color:#555;cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sec-title{font-size:calc(13px * var(--fs));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
  .match{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .match .meta{font-size:calc(12px * var(--fs));color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px}
  .match .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .match .t{font-size:calc(13px * var(--fs));font-weight:600;line-height:1.25}
  .match .t.r{text-align:right}
  .match .t.me{color:#c1121f}
  .score{min-width:64px;text-align:center;font-size:calc(20px * var(--fs));font-weight:800;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:#f2efe8}
  .score.W{background:#d9f2e1;color:#11602c}.score.L{background:#fadcdc;color:#8a1111}.score.D{background:#ece9e1}
  .score.up{font-size:calc(14px * var(--fs));font-weight:700;color:var(--brand)}
  .next{border:2px solid #c1121f}
  .form{display:flex;gap:4px}
  .form i{width:calc(20px * var(--fs));height:calc(20px * var(--fs));border-radius:5px;font-style:normal;font-size:calc(11px * var(--fs));font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
  .form .W{background:#1e8e45}.form .D{background:#8b8b8b}.form .L{background:#c1121f}
  table.st{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:calc(13px * var(--fs))}
  table.st th{background:var(--brand);color:#fff;font-weight:600;padding:8px 4px;font-size:calc(12px * var(--fs))}
  table.st td{padding:9px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.st td.tm{text-align:left;font-weight:600;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.st tr.me td{background:#fde8e9;color:#8a0d16}
  table.st td.p{font-weight:800}
  .news{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
  .news img{width:92px;height:70px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
  .news h3{font-size:calc(14px * var(--fs));margin:0 0 4px;line-height:1.3}
  .news .src{font-size:calc(11px * var(--fs));color:var(--muted)}
  .news p{font-size:calc(12px * var(--fs));color:#444;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .match.hasdet{cursor:pointer}
  .match.hasdet .meta span:first-child::after{content:" · ayrıntı ▾";color:#c1121f}
  .mdet{display:none;border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;font-size:calc(13px * var(--fs))}
  .match.open .mdet{display:block}
  .gol{padding:2px 0}.gol.r{text-align:right}
  .minfo{color:var(--muted);font-size:calc(12px * var(--fs));margin-top:4px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
  .lig-title{font-family:Georgia,serif;font-size:calc(18px * var(--fs));font-weight:700;margin:4px 2px 10px}
  .weeks{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .weeks>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .weeks b{font-size:calc(12px * var(--fs));color:var(--muted);width:calc(58px * var(--fs))}
  .wk{min-width:calc(34px * var(--fs));height:calc(34px * var(--fs));border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:600;font-size:calc(13px * var(--fs));cursor:pointer;color:var(--ink)}
  .wk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  table.fx{width:100%;border-collapse:collapse;background:#fff;font-size:calc(13px * var(--fs));min-width:430px}
  table.fx th{background:var(--brand);color:#fff;font-weight:600;padding:8px 6px;font-size:calc(12px * var(--fs))}
  table.fx td{padding:9px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
  table.fx .r{text-align:right}table.fx .l{text-align:left}
  table.fx td.sc{font-weight:800;font-variant-numeric:tabular-nums}
  table.fx tr.mine td{background:#fde8e9}
  table.fx .me,table.cx .me th{color:#8a0d16;font-weight:700}
  table.st .form{display:inline-flex;gap:2px}table.st .form i{width:calc(16px * var(--fs));height:calc(16px * var(--fs));font-size:calc(9px * var(--fs));border-radius:4px}
  table.cx{border-collapse:collapse;background:#fff;font-size:calc(11px * var(--fs));font-variant-numeric:tabular-nums}
  table.cx th,table.cx td{border:1px solid var(--line);padding:5px 4px;text-align:center;min-width:30px;white-space:nowrap}
  table.cx thead th{background:var(--brand);color:#fff}
  table.cx th.tm{text-align:left;background:#f7f4ee;position:sticky;left:0;font-weight:600}
  table.cx td.x{background:#e6e1d6}table.cx td.mine{background:#fde8e9;font-weight:700}
  .seg button{font-size:calc(13px * var(--fs))}
  .fxlist{display:flex;flex-direction:column;gap:6px}
  .fxrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .fxrow.mine{background:#fde8e9;border-color:#f3b8bc}
  .fxmeta{font-size:calc(12px * var(--fs));color:var(--muted);margin-bottom:6px}
  .fxteams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:calc(14px * var(--fs));font-weight:600;line-height:1.25}
  .fxteams .r{text-align:right}
  .fxteams .sc{min-width:calc(56px * var(--fs));text-align:center;font-weight:800;font-variant-numeric:tabular-nums;background:#f2efe8;border-radius:8px;padding:4px 6px}
  .fxteams .me{color:#8a0d16;font-weight:800}
  @media (max-width:600px){ table.st .gz{display:none} }
  .small{font-size:calc(12px * var(--fs));color:var(--muted);text-align:center;margin:10px 0}

  /* Haber okuyucu */
  #reader{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column}
  #reader.open{display:flex}
  #reader .rbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--brand);color:#fff}
  #reader .rbody{flex:1;overflow:auto;padding:16px 18px 40px;-webkit-overflow-scrolling:touch}
  #reader h1{font-family:Georgia,serif;font-size:calc(22px * var(--fs));line-height:1.3;margin:0 0 8px;color:var(--ink)}
  #reader .rmeta{font-size:calc(12px * var(--fs));color:var(--muted);margin-bottom:12px}
  #reader .rimg{width:100%;border-radius:10px;margin-bottom:14px}
  #reader .rtext p{font-size:calc(16px * var(--fs));line-height:1.65;margin:0 0 14px}
  .hbtns{display:flex;gap:8px}
  #yazi{font-size:18px;font-weight:700;font-family:Georgia,serif}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Gazete İlk Sayfalar</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="yazi" title="Yazı boyutu" aria-label="Yazı boyutunu değiştir">Aa</button>
      <button class="iconbtn" id="refresh" title="Yenile" aria-label="Yenile">⟳</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <input class="search" id="search" type="search" placeholder="Gazete ara…" autocomplete="off">
  <div id="content"></div>
</main>

<div id="viewer" aria-modal="true" role="dialog">
  <div class="vbar">
    <button class="iconbtn" id="vclose" aria-label="Kapat">✕</button>
    <div class="vtitle" id="vtitle"></div>
  </div>
  <div class="stage" id="stage">
    <div class="vloading" id="vloading">Yükleniyor…</div>
    <div class="vnot" id="vnot"></div>
    <img id="vimg" alt="">
    <button class="nav prev" id="prev" aria-label="Önceki">‹</button>
    <button class="nav next" id="next" aria-label="Sonraki">›</button>
    <div class="zoombar">
      <button class="zbtn" id="zout" aria-label="Küçült">−</button>
      <div class="zval" id="zval">100%</div>
      <button class="zbtn" id="zin" aria-label="Büyüt">+</button>
      <button class="zbtn" id="zfit" aria-label="Sığdır" style="font-size:16px">⤢</button>
    </div>
  </div>
</div>

<script src="parse.js?v=__SURUM__"></script>
<div id="reader" role="dialog" aria-modal="true">
  <div class="rbar">
    <button class="iconbtn" id="rclose" aria-label="Geri">‹</button>
    <div class="vtitle" id="rsrc"></div>
  </div>
  <div class="rbody" id="rbody"></div>
</div>

<script>
/* ================== AYARLAR ================== */
const BASE = 'https://gazete.bik.gov.tr/Uygulamalar/GazeteIlkSayfalar';
const KAYNAKLAR = [
  { id:'edirne', ad:'Edirne',  url: BASE + '?kapsam=yerel&il=37' },
  { id:'yaygin', ad:'Ulusal',  url: BASE + '?kapsam=yaygin' },
  { id:'kesan',  ad:'Keşanspor', ozel:true },
];
/* ============================================= */

const $ = s => document.querySelector(s);
// Açık sekme adres çubuğunda tutulur (#edirne, #ulusal, #kesanspor-lig …): yenileyince aynı yerde kalır
const HASH = { edirne:'edirne', yaygin:'ulusal', kesan:'kesanspor' };
function hashSekme(){
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase().split('-')[0];
  return Object.keys(HASH).find(k => HASH[k] === h) || null;
}
function hashYaz(sekme, alt){
  try{ history.replaceState(history.state, '', '#' + HASH[sekme] + (alt ? '-' + alt : '')); }catch{}
}
const state = { tab: hashSekme() || (window.BULUT ? 'kesan' : KAYNAKLAR[0].id), data: {}, list: [], index: 0 };

$('#date').textContent = new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

// Sekmeler
KAYNAKLAR.forEach(k=>{
  const b = document.createElement('button');
  b.className = 'tab' + (k.id===state.tab?' active':'');
  b.textContent = k.ad; b.dataset.id = k.id;
  b.onclick = () => { state.tab = k.id; hashYaz(k.id, k.ozel && Kesan.altSekme ? Kesan.altSekme() : ''); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===k.id)); $('#search').value=''; load(); };
  $('#tabs').appendChild(b);
});
$('#refresh').onclick = () => load(true);
// Yazı boyutu: Büyük (varsayılan) → Çok büyük → Normal; seçim bu cihazda hatırlanır
const BOYUT = [{ad:'Büyük',v:1.3},{ad:'Çok büyük',v:1.55},{ad:'Normal',v:1}];
let boyutI = 0; try{ boyutI = Math.max(0, BOYUT.findIndex(b => b.v === +localStorage.getItem('yaziBoyutu'))); }catch{}
function boyutUygula(){ document.documentElement.style.setProperty('--fs', BOYUT[boyutI].v); $('#yazi').title = 'Yazı: ' + BOYUT[boyutI].ad; }
$('#yazi').onclick = () => { boyutI = (boyutI + 1) % BOYUT.length; boyutUygula();
  try{ localStorage.setItem('yaziBoyutu', BOYUT[boyutI].v); }catch{} };
boyutUygula();
$('#search').oninput = render;

/* ---------- Veri çekme ---------- */
let _latest=null;
async function getLatest(force){
  if(_latest && !force) return _latest;
  const r = await fetch('data/latest.json?t=' + Date.now());
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return _latest = await r.json();
}
async function getHtml(url){
  // APK'da (Capacitor) CapacitorHttp etkin olduğu için fetch CORS'a takılmaz.
  const r = await fetch(url, { headers: { 'Accept':'text/html' } });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}



async function load(force=false){
  const k = KAYNAKLAR.find(x=>x.id===state.tab);
  $('#search').style.display = k.ozel ? 'none' : '';
  if(k.ozel){ return Kesan.show(force); }
  if(window.STATIK){
    $('#content').innerHTML = '<div class="status"><div class="spinner"></div>Gazeteler yükleniyor…</div>';
    try{
      const j = await getLatest(force);
      state.data.edirne = j.gazete.edirne || []; state.data.yaygin = j.gazete.yaygin || [];
      render(j.gazete.t ? '<div class="small" style="margin:0 0 10px">'+new Date(j.gazete.t).toLocaleString('tr-TR')+' itibarıyla</div>' : '');
    }catch(e){ $('#content').innerHTML = '<div class="status">Gazete listesi alınamadı.<br><small>'+e.message+'</small><br><button class="btn" onclick="load(true)">Tekrar dene</button></div>'; }
    return;
  }
  if(window.BULUT){
    $('#search').style.display='none';
    $('#content').innerHTML = `<div class="status" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 18px">
      <b style="font-size:16px;color:var(--ink)">${k.ad} gazetelerinin ilk sayfaları Android uygulamasında görünür.</b><br><br>
      Gazete görselleri bu web sürümünde gösterilemiyor.</div>`;
    return;
  }
  if(!force && state.data[k.id]){ render(); return; }
  $('#content').innerHTML = '<div class="status"><div class="spinner"></div>Gazeteler yükleniyor…</div>';
  try{
    const html = await getHtml(k.url);
    const list = parseNewspapers(html, k.url);
    state.data[k.id] = list;
    try{ localStorage.setItem('cache_'+k.id, JSON.stringify({t:Date.now(), list})); }catch{}
    render();
  }catch(err){
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem('cache_'+k.id)||'null'); }catch{}
    if(cached && cached.list.length){
      state.data[k.id] = cached.list; render(
        '<div class="status" style="padding:8px 0 14px">Bağlantı yok — '+new Date(cached.t).toLocaleString('tr-TR')+' tarihli kayıt gösteriliyor.</div>');
      return;
    }
    $('#content').innerHTML = `<div class="status">Gazeteler alınamadı.<br><small>${err.message}</small><br>
      
      <button class="btn" onclick="load(true)">Tekrar dene</button>
      <button class="btn ghost" onclick="demo()">Örnek veriyle dene</button></div>`;
  }
}

function render(prefix=''){
  if(KAYNAKLAR.find(x=>x.id===state.tab).ozel) return;
  const all = state.data[state.tab] || [];
  const q = $('#search').value.trim().toLocaleLowerCase('tr-TR');
  state.list = q ? all.filter(g=>g.name.toLocaleLowerCase('tr-TR').includes(q)) : all;
  if(!all.length){ $('#content').innerHTML = '<div class="status">Bu bölümde bugün gazete bulunamadı.</div>'; return; }
  const grid = document.createElement('div'); grid.className = 'grid';
  state.list.forEach((g,i)=>{
    const c = document.createElement('div'); c.className='card';
    c.innerHTML = `<div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" alt=""></div><div class="name"></div>`;
    c.querySelector('img').src = g.thumb;
    c.querySelector('.name').textContent = g.name;
    c.onclick = () => openViewer(i);
    grid.appendChild(c);
  });
  $('#content').innerHTML = typeof prefix==='string' ? prefix : '';
  $('#content').appendChild(grid);
}

/* ---------- Örnek veri (tarayıcıda arayüzü denemek için) ---------- */
function demo(){
  const names = state.tab==='edirne'
    ? ['Edirne Gazetesi A','Edirne Gazetesi B','Edirne Gazetesi C','Edirne Gazetesi D']
    : ['Ulusal Gazete 1','Ulusal Gazete 2','Ulusal Gazete 3','Ulusal Gazete 4','Ulusal Gazete 5','Ulusal Gazete 6'];
  state.data[state.tab] = names.map((n,i)=>{
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1760"><rect width="100%" height="100%" fill="#fff"/>
      <rect x="40" y="40" width="1120" height="180" fill="hsl(${i*55},55%,35%)"/><text x="600" y="160" font-size="90" text-anchor="middle" fill="#fff" font-family="Georgia">${n}</text>
      ${Array.from({length:30},(_,r)=>`<rect x="60" y="${280+r*48}" width="${700+((r*137)%400)}" height="18" fill="#ccc"/>`).join('')}</svg>`;
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return { name:n, thumb:url, full:url };
  });
  render();
}

/* ---------- Görüntüleyici + yakınlaştırma ---------- */
const stage = $('#stage'), vimg = $('#vimg');
const Z = { s:1, x:0, y:0, min:0.2, max:8, fit:1 };

function boyutla(){ vimg.style.width = (vimg.naturalWidth * Z.s) + 'px'; vimg.style.height = (vimg.naturalHeight * Z.s) + 'px'; }
function apply(){
  boyutla();
  vimg.style.transform = `translate(${Z.x}px,${Z.y}px)`;
  $('#zval').textContent = Math.round(Z.s / Z.fit * 100) + '%';
}
function clampPan(){
  const r = stage.getBoundingClientRect(), w = vimg.naturalWidth*Z.s, h = vimg.naturalHeight*Z.s;
  Z.x = w <= r.width  ? (r.width-w)/2  : Math.min(0, Math.max(r.width-w,  Z.x));
  Z.y = h <= r.height ? (r.height-h)/2 : Math.min(0, Math.max(r.height-h, Z.y));
}
function fit(){
  const r = stage.getBoundingClientRect();
  Z.fit = Math.min(r.width / vimg.naturalWidth, r.height / vimg.naturalHeight);
  Z.min = Z.fit * 0.5; Z.max = Z.fit * 8;
  Z.s = Z.fit; Z.x = 0; Z.y = 0; clampPan(); apply();
}
function zoomAt(factor, cx, cy){
  const r = stage.getBoundingClientRect();
  if(cx==null){ cx = r.width/2; cy = r.height/2; }
  const ns = Math.min(Z.max, Math.max(Z.min, Z.s*factor)), k = ns/Z.s;
  Z.x = cx - (cx - Z.x)*k; Z.y = cy - (cy - Z.y)*k; Z.s = ns;
  clampPan(); apply();
}
$('#zin').onclick  = e => { e.stopPropagation(); zoomAt(1.4); };
$('#zout').onclick = e => { e.stopPropagation(); zoomAt(1/1.4); };
$('#zfit').onclick = e => { e.stopPropagation(); fit(); };

function openViewer(i){
  state.index = i; const g = state.list[i];
  $('#vtitle').textContent = g.name;
  $('#vloading').style.display = 'flex'; vimg.style.visibility = 'hidden';
  $('#vnot').style.display = 'none';
  vimg.onload = () => { $('#vloading').style.display='none'; vimg.style.visibility='visible'; fit(); };
  vimg.onerror = () => {
    if(g.thumb && vimg.src !== g.thumb){
      $('#vnot').textContent = 'Yüksek çözünürlüklü sayfa açılamadı, küçük hali gösteriliyor.';
      $('#vnot').style.display = 'block';
      vimg.src = g.thumb;
    } else { $('#vloading').textContent = 'Görsel açılamadı. İnternet bağlantını kontrol edip tekrar dene.'; }
  };
  // Çok yavaş açılırsa (ör. 15 sn) küçük hale geç
  clearTimeout(window._yavas); window._yavas = setTimeout(() => {
    if(vimg.src === g.full && !vimg.complete && g.thumb){ vimg.onerror(); }
  }, 15000);
  vimg.referrerPolicy = 'no-referrer';
  vimg.src = g.full;
  $('#prev').style.display = i>0 ? '' : 'none';
  $('#next').style.display = i<state.list.length-1 ? '' : 'none';
  $('#viewer').classList.add('open');
  try{ history.pushState({viewer:true}, ''); }catch{}
}
function closeViewer(){ $('#viewer').classList.remove('open'); vimg.removeAttribute('src'); $('#vloading').textContent='Yükleniyor…'; }
$('#vclose').onclick = () => history.back();
window.addEventListener('popstate', () => { if($('#viewer').classList.contains('open')) closeViewer(); });
$('#prev').onclick = e => { e.stopPropagation(); if(state.index>0){ history.replaceState({viewer:true},''); openViewerNoPush(state.index-1); } };
$('#next').onclick = e => { e.stopPropagation(); if(state.index<state.list.length-1){ openViewerNoPush(state.index+1); } };
function openViewerNoPush(i){ const push = history.pushState; history.pushState = ()=>{}; openViewer(i); history.pushState = push; }

// Fare tekerleği
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive:false });

// Sürükleme + iki parmakla yakınlaştırma + çift dokunma
const ptrs = new Map(); let last = null, pinch = null, lastTap = 0;
// Kaydırarak gazete değiştirme: yalnızca gazete tam ekran (büyütülmemiş) haldeyken
let sw = null;
const tamBoy = () => Z.s <= Z.fit * 1.02;
function gec(yon){
  const i = state.index + yon;
  if(i < 0 || i >= state.list.length) return false;
  vimg.style.transition = 'transform .18s ease-out';
  vimg.style.transform = `translate(${Z.x - yon * stage.clientWidth}px,${Z.y}px)`;
  setTimeout(() => { vimg.style.transition = ''; openViewerNoPush(i); }, 180);
  return true;
}
stage.addEventListener('pointerdown', e => {
  if(e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  stage.classList.add('drag');
  if(ptrs.size === 1){
    sw = { x0:e.clientX, y0:e.clientY, dx:0, dy:0, aktif: tamBoy(), iptal:false };
    last = {x:e.clientX, y:e.clientY};
    const now = Date.now();
    if(now - lastTap < 300){ const r = stage.getBoundingClientRect();
      Z.s > Z.fit*1.05 ? fit() : zoomAt(2.5, e.clientX-r.left, e.clientY-r.top); }
    lastTap = now;
  } else if(ptrs.size === 2){
    if(sw) sw.iptal = true;
    const [a,b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), s: Z.s };
  }
});
stage.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const r = stage.getBoundingClientRect();
  if(ptrs.size === 2 && pinch){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    zoomAt((pinch.s * d/pinch.d) / Z.s, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
  } else if(ptrs.size === 1 && sw && sw.aktif && !sw.iptal){
    // Tam boydayken: görsel parmağı yatayda takip eder
    sw.dx = e.clientX - sw.x0; sw.dy = e.clientY - sw.y0;
    if(Math.abs(sw.dx) > Math.abs(sw.dy)){
      const uc = (sw.dx > 0 && state.index === 0) || (sw.dx < 0 && state.index === state.list.length-1);
      vimg.style.transform = `translate(${Z.x + (uc ? sw.dx/4 : sw.dx)}px,${Z.y}px)`;
    }
  } else if(ptrs.size === 1 && last){
    Z.x += e.clientX - last.x; Z.y += e.clientY - last.y;
    last = {x:e.clientX, y:e.clientY}; clampPan(); apply();
  }
});
function up(e){
  if(ptrs.size === 1 && sw && sw.aktif && !sw.iptal){
    const yatay = Math.abs(sw.dx) > 60 && Math.abs(sw.dx) > Math.abs(sw.dy) * 1.3;
    if(!(yatay && gec(sw.dx < 0 ? 1 : -1))){
      vimg.style.transition = 'transform .15s ease-out'; apply();
      setTimeout(() => vimg.style.transition = '', 160);
    }
    sw = null;
  }
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(ptrs.size===1){ const p=[...ptrs.values()][0]; last={x:p.x,y:p.y}; }
  if(!ptrs.size){ last=null; stage.classList.remove('drag'); } }
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
window.addEventListener('resize', () => { if($('#viewer').classList.contains('open') && vimg.naturalWidth) fit(); });

</script>
