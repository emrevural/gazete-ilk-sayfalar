name: Verileri güncelle ve yayınla
on:
  schedule:
    # TR saatiyle 07:30, 10:30, 16:30, 22:30 (gazeteler sabah, maç sonuçları akşam)
    - cron: '30 4,7,13,19 * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/guncelle.yml']
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: guncelle
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url || steps.yayin2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save jsdom@24
      - name: Gazeteleri, TFF'yi ve haberleri çek
        env: { TZ: Europe/Istanbul }
        run: node scripts/update.mjs
      - name: Veriyi main dalına kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json
          if ! git diff --staged --quiet; then
            git commit -m "veri: $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M')"
            git pull --rebase && git push
          fi
      - name: Önbellek için sürüm numarası
        run: sed -i "s/__SURUM__/${GITHUB_SHA::7}/g" web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: web }
      - id: yayin
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Yayın başarısızsa bekle
        if: steps.yayin.outcome == 'failure'
        run: sleep 30
      - id: yayin2
        if: steps.yayin.outcome == 'failure'
        uses: actions/deploy-pages@v4
