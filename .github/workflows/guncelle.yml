name: Verileri güncelle ve yayınla
on:
  schedule:
    # TR saatiyle 07:30, 10:30, 16:30, 22:30 (gazeteler sabah, maç sonuçları akşam)
    - cron: '30 4,7,13,19 * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/guncelle.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: guncelle
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save jsdom@24
      - name: Gazeteleri, TFF'yi ve haberleri çek
        env: { TZ: Europe/Istanbul }
        run: node scripts/update.mjs
      - name: Veriyi main dalına kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json
          if ! git diff --staged --quiet; then
            git commit -m "veri: $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M')"
            git pull --rebase && git push
          fi
      - name: Siteyi gh-pages dalına yayınla
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "yayın $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
